<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS · Visión IA</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header class="header">
    <div class="brand">IRIS<span class="brand-sub">Visión IA</span></div>
    <div class="patient-banner">
      <div class="pb-name" id="pName">Paciente</div>
      <div class="pb-meta">
        <span class="pb-tag">ID</span><span id="pId">—</span><span class="pb-sep">|</span>
        <span class="pb-tag">Sexo</span><span id="pSex">—</span><span class="pb-sep">|</span>
        <span class="pb-tag">Edad</span><span id="pAge">—</span><span class="pb-sep">|</span>
        <span class="pb-tag">FN</span><span id="pBirth">—</span>
      </div>
      <div class="pb-study">
        <span id="studyDesc">—</span><span class="pb-sep">|</span>
        <span class="pb-tag">Modalidad</span><span id="studyMod">—</span><span class="pb-sep">|</span>
        <span id="studyDate">—</span><span class="pb-sep">|</span>
        <span class="pb-tag">Acc</span><span id="studyAcc">—</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="hdr-btn" id="btnSync" title="Sincronizar scroll entre vistas"><i class="material-icons">link</i></button>
      <button class="hdr-btn accent" id="btnReport" title="Reporte IA"><i class="material-icons">notes</i> REPORTE</button>
      <button class="hdr-btn" id="btnNew" title="Nuevo estudio"><i class="material-icons">folder_open</i></button>
    </div>
  </header>

  <nav class="toolbar">
    <div class="tb-group">
      <button class="tb-btn active" data-layout="1x1" title="1 vista"><i class="material-icons">crop_square</i></button>
      <button class="tb-btn" data-layout="1x2" title="2 vistas"><i class="material-icons">view_column</i></button>
      <button class="tb-btn" data-layout="2x2" title="4 vistas"><i class="material-icons">grid_view</i></button>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-group">
      <button class="tb-btn active" data-tool="WindowLevel" title="Ventana/Nivel"><i class="material-icons">brightness_6</i></button>
      <button class="tb-btn" data-tool="Pan" title="Mover"><i class="material-icons">open_with</i></button>
      <button class="tb-btn" data-tool="Zoom" title="Zoom"><i class="material-icons">zoom_in</i></button>
      <button class="tb-btn" data-tool="Length" title="Longitud"><i class="material-icons">straighten</i></button>
      <button class="tb-btn" data-tool="Angle" title="Ángulo"><i class="material-icons">square_foot</i></button>
      <button class="tb-btn" data-tool="RectangleROI" title="ROI rectangular"><i class="material-icons">crop_5_4</i></button>
      <button class="tb-btn" data-tool="EllipticalROI" title="ROI elíptico"><i class="material-icons">radio_button_unchecked</i></button>
      <button class="tb-btn" data-tool="Probe" title="Densidad (HU)"><i class="material-icons">colorize</i></button>
      <button class="tb-btn" data-tool="ArrowAnnotate" title="Anotación"><i class="material-icons">north_east</i></button>
      <button class="tb-btn" data-tool="Eraser" title="Borrar medidas"><i class="material-icons">delete_sweep</i></button>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-group">
      <select id="presetSelect" class="tb-select">
        <option value="">Presets WW/WL</option>
      </select>
    </div>
    <div class="tb-divider"></div>
    <div class="tb-group">
      <button class="tb-btn" id="btnCine" title="Cine (reproducción)"><i class="material-icons">play_circle</i></button>
      <button class="tb-btn" id="btnInvert" title="Invertir"><i class="material-icons">invert_colors</i></button>
      <button class="tb-btn" id="btnReset" title="Reiniciar vista"><i class="material-icons">restart_alt</i></button>
    </div>
  </nav>

  <main class="main">
    <aside class="sidebar">
      <div class="sidebar-title">SERIES</div>
      <div class="series-list" id="seriesList"></div>
    </aside>
    <section class="viewer">
      <div class="viewport-grid layout-1x1" id="viewerGrid"></div>
    </section>
    <aside class="report-drawer" id="reportDrawer">
      <div class="report-header">
        <span>HALLAZGOS IA</span>
        <i class="material-icons" id="btnReportClose" title="Cerrar">close</i>
      </div>
      <div class="report-content" id="aiContent">—</div>
    </aside>
  </main>

  <div id="loadingOverlay" class="loading-overlay" style="display:none;">
    <div class="loader-content">
      <div class="pulse-logo">IRIS</div>
      <div class="loading-bar-container"><div id="progressBar" class="loading-bar"></div></div>
      <p id="loadingText" class="loading-text">Iniciando...</p>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <div class="modal" id="startupModal">
    <div class="modal-box">
      <h3>Cargar Estudio</h3>
      <input type="text" id="urlInput" placeholder="Study UID o URL del visor...">
      <button id="btnProcesar">PROCESAR</button>
    </div>
  </div>

  <script type="module" src="/static/cs3/viewer.js"></script>
</body>
</html>
